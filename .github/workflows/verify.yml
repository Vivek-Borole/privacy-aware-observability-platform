name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm console:typecheck
      - run: pnpm console:build
      - run: pnpm synthetic:typecheck
      - run: go vet ./...
      - run: go test -race ./...
      - run: pnpm audit --audit-level=high
      - run: bash scripts/secret-scan.sh
      - run: node scripts/validate-benchmark-report.mjs --self-test
      - run: docker compose config >/dev/null
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/privacy-aware-observability-platform
      - run: helm template paop deploy/helm/privacy-aware-observability-platform -f deploy/helm/privacy-aware-observability-platform/values-kind.yaml >/tmp/paop-rendered.yaml

  container-and-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - run: ./scripts/kind-smoke.sh
