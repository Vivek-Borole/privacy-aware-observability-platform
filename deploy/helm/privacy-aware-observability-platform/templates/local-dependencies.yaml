{{- if .Values.localDependencies.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: paop-runtime
  labels: {{- include "paop.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-url: postgres://paop:paop-local-only@postgres:5432/paop?sslmode=disable
  clickhouse-url: http://paop:paop-local-only@clickhouse:8123
  {{- $existing := lookup "v1" "Secret" .Release.Namespace "paop-runtime" }}
  {{- if and $existing (hasKey $existing.data "api-key") }}
  api-key: {{ index $existing.data "api-key" | b64dec | quote }}
  {{- else }}
  api-key: {{ randAlphaNum 48 | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          args: [postgres, -c, shared_buffers=256MB, -c, max_connections=200, -c, checkpoint_timeout=15min, -c, checkpoint_completion_target=0.9, -c, max_wal_size=4GB, -c, min_wal_size=512MB]
          env:
            - {name: POSTGRES_DB, value: paop}
            - {name: POSTGRES_USER, value: paop}
            - {name: POSTGRES_PASSWORD, value: paop-local-only}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe: {tcpSocket: {port: postgres}, initialDelaySeconds: 2, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec: {selector: {app: postgres}, ports: [{name: postgres, port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redpanda}
spec:
  replicas: 1
  selector: {matchLabels: {app: redpanda}}
  template:
    metadata: {labels: {app: redpanda}}
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v25.1.4
          args: [redpanda, start, --overprovisioned, --smp, "1", --memory, 768M, --reserve-memory, 0M, --node-id, "0", --check=false, --kafka-addr, 0.0.0.0:9092, --advertise-kafka-addr, redpanda:9092]
          ports: [{name: kafka, containerPort: 9092}, {name: admin, containerPort: 9644}]
          readinessProbe: {tcpSocket: {port: kafka}, initialDelaySeconds: 5, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: redpanda}
spec: {selector: {app: redpanda}, ports: [{name: kafka, port: 9092}, {name: admin, port: 9644}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: clickhouse}
spec:
  replicas: 1
  selector: {matchLabels: {app: clickhouse}}
  template:
    metadata: {labels: {app: clickhouse}}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.3-alpine
          env:
            - {name: CLICKHOUSE_DB, value: telemetry}
            - {name: CLICKHOUSE_USER, value: paop}
            - {name: CLICKHOUSE_PASSWORD, value: paop-local-only}
          ports: [{name: http, containerPort: 8123}]
          readinessProbe: {httpGet: {path: /ping, port: http}, initialDelaySeconds: 5, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: clickhouse}
spec: {selector: {app: clickhouse}, ports: [{name: http, port: 8123}]}
{{- end }}
