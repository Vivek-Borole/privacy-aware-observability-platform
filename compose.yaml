services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: paop
      POSTGRES_USER: paop
      POSTGRES_PASSWORD: paop-local-only
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paop -d paop"]
      interval: 5s
      timeout: 3s
      retries: 20
  redpanda:
    image: redpandadata/redpanda:v25.1.4
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "internal://0.0.0.0:9092,external://0.0.0.0:19092", "--advertise-kafka-addr", "internal://redpanda:9092,external://127.0.0.1:19092"]
    ports: ["19092:19092", "19644:9644"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    environment:
      CLICKHOUSE_DB: telemetry
      CLICKHOUSE_USER: paop
      CLICKHOUSE_PASSWORD: paop-local-only
    ports: ["18123:8123", "19000:9000"]
  clickhouse-migrate:
    build:
      context: .
      target: clickhouse-migrate
    environment:
      PAOP_CLICKHOUSE_URL: http://paop:paop-local-only@clickhouse:8123
    depends_on:
      clickhouse: {condition: service_started}
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.124.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["19090:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - "./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["13000:3000"]
    depends_on:
      prometheus: {condition: service_started}
  topic-init:
    image: redpandadata/redpanda:v25.1.4
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |-
        until rpk cluster info -X brokers=redpanda:9092; do sleep 1; done
        rpk topic create sanitized-telemetry-v1 -X brokers=redpanda:9092 -p 1 -r 1 || rpk topic list -X brokers=redpanda:9092 | grep -q '^sanitized-telemetry-v1'
    depends_on:
      redpanda: {condition: service_started}
  gateway:
    build: .
    environment:
      PAOP_POSTGRES_URL: postgres://paop:paop-local-only@postgres:5432/paop?sslmode=disable
      PAOP_KAFKA_BROKERS: redpanda:9092
      PAOP_POLICY_VERSION: local-v1
      PAOP_REDACTION_PATTERNS: "customer-[0-9]+"
    ports: ["18080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_started}
      migrate: {condition: service_completed_successfully}
      synthetic-bootstrap: {condition: service_completed_successfully}
      topic-init: {condition: service_completed_successfully}
  migrate:
    build:
      context: .
      target: migrate
    environment:
      PAOP_POSTGRES_URL: postgres://paop:paop-local-only@postgres:5432/paop?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  synthetic-bootstrap:
    build:
      context: .
      target: bootstrap
    environment:
      PAOP_POSTGRES_URL: postgres://paop:paop-local-only@postgres:5432/paop?sslmode=disable
      PAOP_TENANT_ID: synthetic-compose
      PAOP_API_KEY: synthetic-compose-key-not-for-production
    depends_on:
      migrate: {condition: service_completed_successfully}
  persist:
    build:
      context: .
      target: persist
    environment:
      PAOP_POSTGRES_URL: postgres://paop:paop-local-only@postgres:5432/paop?sslmode=disable
      PAOP_KAFKA_BROKERS: redpanda:9092
      PAOP_CLICKHOUSE_URL: http://paop:paop-local-only@clickhouse:8123
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_started}
      topic-init: {condition: service_completed_successfully}
      clickhouse-migrate: {condition: service_completed_successfully}
  query:
    build:
      context: .
      target: query
    environment:
      PAOP_POSTGRES_URL: postgres://paop:paop-local-only@postgres:5432/paop?sslmode=disable
      PAOP_CLICKHOUSE_URL: http://paop:paop-local-only@clickhouse:8123
      PAOP_CONSOLE_ORIGIN: http://localhost:5173
    ports: ["18081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse-migrate: {condition: service_completed_successfully}
  synthetic-worker:
    build:
      context: .
      target: synthetic-worker
    environment:
      PAOP_INGEST_URL: http://gateway:8080
      PAOP_SYNTHETIC_API_KEY: synthetic-compose-key-not-for-production
    depends_on:
      gateway: {condition: service_started}
  synthetic-downstream:
    build:
      context: .
      target: synthetic-downstream
    environment:
      PAOP_INGEST_URL: http://gateway:8080
      PAOP_SYNTHETIC_API_KEY: synthetic-compose-key-not-for-production
      PAOP_SYNTHETIC_WORKER_URL: http://synthetic-worker:8092
    depends_on:
      gateway: {condition: service_started}
      synthetic-worker: {condition: service_started}
  synthetic-api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "--experimental-strip-types", "apps/synthetic-gateway/src/main.ts"]
    volumes: [".:/app:ro"]
    environment:
      PAOP_INGEST_URL: http://gateway:8080
      PAOP_SYNTHETIC_API_KEY: synthetic-compose-key-not-for-production
      PAOP_SYNTHETIC_DOWNSTREAM_URL: http://synthetic-downstream:8091
    ports: ["18090:8090"]
    depends_on:
      gateway: {condition: service_started}
      synthetic-downstream: {condition: service_started}
