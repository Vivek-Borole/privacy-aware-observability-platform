apiVersion: v1
kind: Service
metadata: {name: paop-gateway}
spec:
  selector: {{- include "paop.selector" (dict "name" "gateway" "root" .) | nindent 4 }}
  ports: [{name: http, port: 8080}, {name: grpc, port: 4317}]
---
apiVersion: v1
kind: Service
metadata: {name: paop-query}
spec:
  selector: {{- include "paop.selector" (dict "name" "query" "root" .) | nindent 4 }}
  ports: [{name: http, port: 8081}]
