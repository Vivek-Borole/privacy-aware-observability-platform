receivers:
  # The collector observes platform health only. It does not receive tenant
  # telemetry, which must enter the redaction-first gateway directly.
  prometheus:
    config:
      scrape_configs:
        - job_name: paop-gateway
          static_configs:
            - targets: [gateway:8080]
        - job_name: paop-query
          static_configs:
            - targets: [query:8081]
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheus]
